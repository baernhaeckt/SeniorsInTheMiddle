; Process layout of the backend image: the python services and the dotnet proxy
; side by side, supervised by supervisord (PID 1, see backend/Dockerfile).
;
; Every program runs as the image's app user, writes straight to the container
; log and is restarted when it exits. Socket paths come from the image ENV so
; the daemon and the proxy always agree on them.
;
; Adding a service: copy the [program:pii-service] block, change the module, the
; socket env var and the priority. Lower priority starts first:
; pii-service (10) -> privacy-check-service (11) -> proxy (20).

; The control socket for `supervisorctl status|restart pii-service` comes from the
; distribution's /etc/supervisor/supervisord.conf, which includes this file.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

; ------------------------------------------------------------ python services

[program:pii-service]
command=/opt/venv/bin/python -m pii_service
directory=/srv/services
user=app
environment=SERVICE_SOCKET_PATH="%(ENV_PII_SOCKET_PATH)s",SERVICE_LOG_LEVEL="INFO",PII_SCORE_THRESHOLD="%(ENV_PII_SCORE_THRESHOLD)s"
priority=10
autostart=true
autorestart=true
; loading the spaCy model takes a few seconds; a process that dies before this
; counts as a failed start and is retried startretries times
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:privacy-check-service]
command=/opt/venv/bin/python -m privacy_check_service
directory=/srv/services
user=app
; one risk check runs an MCMC sampler (pymc) and takes well over the runtime's
; default 30 s request budget
environment=SERVICE_SOCKET_PATH="%(ENV_PRIVACY_CHECK_SOCKET_PATH)s",SERVICE_LOG_LEVEL="INFO",SERVICE_REQUEST_TIMEOUT="600",PRIVACY_MCMC_DRAWS="%(ENV_PRIVACY_MCMC_DRAWS)s",PRIVACY_MCMC_TUNE="%(ENV_PRIVACY_MCMC_TUNE)s"
priority=11
autostart=true
autorestart=true
; loading the embedding model (torch) takes a few seconds
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --------------------------------------------------------------------- proxy

[program:proxy]
command=dotnet /app/SeniorsInTheMiddle.Proxy.dll
directory=/app
user=app
priority=20
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
