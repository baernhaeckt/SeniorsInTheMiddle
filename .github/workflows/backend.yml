name: build-deploy-backend

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      COMPONENT: "backend"

    steps:
      - name: Compute names
        run: |
          owner_lc=${GITHUB_REPOSITORY_OWNER,,}
          repo=${GITHUB_REPOSITORY#*/}
          repo_lc=${repo,,}
          comp_lc=${COMPONENT,,}
          echo "OWNER_LC=$owner_lc" >> $GITHUB_ENV
          echo "REPO_LC=$repo_lc"   >> $GITHUB_ENV
          echo "COMP_LC=$comp_lc"   >> $GITHUB_ENV
          echo "IMAGE_REPO=ghcr.io/$owner_lc/$repo_lc-$comp_lc" >> $GITHUB_ENV

      - name: Checkout (sparse)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/workflows
            backend
          sparse-checkout-cone: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:latest
          # Keeps the NuGet restore layer warm between runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Serves /api/v1, the telemetry stream and the forward proxy on the same port.
      #
      # A forward proxy needs CONNECT to reach it, which HTTP ingress terminates --
      # revisit the ingress mode (TCP vs HTTP) once the Azure tenant is available.
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ vars.AZURE_RG }}                    # will be created if missing
          containerAppName: ${{ env.REPO_LC }}-${{ env.COMP_LC }} # will be created/updated
          containerAppEnvironment: ${{ vars.AZURE_CONTAINERAPPS_ENV }} # will be created if missing
          location: ${{ vars.AZURE_LOCATION }}                   # region for created resources
          imageToDeploy: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          registryUrl: ghcr.io
          registryUsername: ${{ secrets.GHCR_USERNAME }}
          registryPassword: ${{ secrets.GHCR_PAT }}
          ingress: external
          targetPort: 8080
          # Add more environment variables here if needed, space separated
          # e.g. ASPNETCORE_ENVIRONMENT=Production ANOTHER_VAR=Value
          # The SPA origin is baked into appsettings.json. To point at a different
          # frontend URL, append Cors__AllowedOrigins__0=https://<host> below --
          # but only with a real value: an empty one blanks the entry and CORS
          # then blocks every origin.
          environmentVariables: MY_ENV_VARIABLE=${{ vars.MY_ENV_VARIABLE }} Jwt__Key=secretref:jwtkey
