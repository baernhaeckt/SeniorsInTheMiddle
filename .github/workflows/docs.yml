name: build-documents

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "pitch/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Arial (mscorefonts)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The postinst aborts with "user did not accept the mscorefonts-eula
          # license" unless the question is preseeded, and apt still exits 0.
          echo 'ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula boolean true' \
            | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ttf-mscorefonts-installer \
            fontconfig
          fc-cache -f

      - name: Verify Arial is available
        run: |
          fc-list | grep -qi 'Arial' || {
            echo "::error::Arial was not installed - the PDF would silently fall back to another font."
            exit 1
          }
          fc-list | grep -i 'Arial'

      - name: Download the deck fonts
        run: |
          # The deck is designed in the same faces as the dashboard, and neither ships
          # with the runner. Only the static cuts are usable: Typst reads a variable font
          # as its default instance only, so the variable Archivo would arrive without a bold.
          mkdir -p "$RUNNER_TEMP/deck-fonts"
          archivo=https://github.com/Omnibus-Type/Archivo/raw/master/fonts/ttf
          for weight in Regular Medium SemiBold Bold; do
            curl -fsSL -o "$RUNNER_TEMP/deck-fonts/Archivo-$weight.ttf" "$archivo/Archivo-$weight.ttf"
          done
          plex=https://github.com/IBM/plex/raw/master/packages/plex-sans/fonts/complete/ttf
          for weight in Regular Medium; do
            curl -fsSL -o "$RUNNER_TEMP/deck-fonts/IBMPlexSans-$weight.ttf" "$plex/IBMPlexSans-$weight.ttf"
          done

      - name: Install Typst
        uses: typst-community/setup-typst@v5

      - name: Verify the deck fonts reached Typst
        run: |
          # Typst only warns about a missing family and renders on with a substitute,
          # so the families are asserted against the tool itself, not against fontconfig.
          typst fonts --font-path "$RUNNER_TEMP/deck-fonts" > "$RUNNER_TEMP/families.txt"
          for family in 'Archivo' 'IBM Plex Sans'; do
            grep -qx "$family" "$RUNNER_TEMP/families.txt" || {
              echo "::error::$family is missing - the deck would silently render in a substitute."
              exit 1
            }
          done
          grep -E '^(Archivo|IBM Plex Sans)$' "$RUNNER_TEMP/families.txt"

      - name: Compile the jury documentation
        working-directory: docs
        run: typst compile main.typ jury-documentation.pdf

      - name: Compile the pitch deck
        working-directory: pitch
        run: typst compile --font-path "$RUNNER_TEMP/deck-fonts" slides.typ pitch-slides.pdf

      - name: Upload the jury documentation
        uses: actions/upload-artifact@v7
        with:
          name: jury-documentation
          path: docs/jury-documentation.pdf
          if-no-files-found: error

      - name: Upload the pitch deck
        uses: actions/upload-artifact@v7
        with:
          name: pitch-slides
          path: pitch/pitch-slides.pdf
          if-no-files-found: error
